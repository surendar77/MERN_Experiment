<html>
    <head>

<script src="https://code.jquery.com/jquery-4.1.0.min.js" integrity="sha256-hjRvPkFLO1JGZFMXGrzdpG6TlsHDyjp4PQeqLWRcMzk=" crossorigin="anonymous"></script>
<link rel="stylesheet" href="./bootstrap-5.3.9-dist/bootstrap-5.3.9-dist/css/bootstrap.min.css" type="text/css">
    </head>
    <body class="bg-light">
       <div class="container mt-5">
           <h2 class="text-center mb-4">Todo Application</h2>
            <!-- ADD task components start -->
      
           <div class="card shadow p-4">
            <div class="input-group">
                <input type="text" id="task"
                  class="form-control"
                  placeholder="Enter your task">
                <button class="btn btn-primary"
                id="addtask">Add</button>
            </div>
           <p id="message" class="text-center mt-2"></p>
           </div>
            <!-- ADD task components end -->
            <!-- Task status start -->
           <div class="row mt-4 text-center">
              <div class="col-md-4 mb-2">
                <div class="card bg-primary text-white p-3">
                    <h5>Total tasks</h5>
                    <h3 id="total">0</h3>
                </div>
              </div>  
              <div class="col-md-4 mb-2">
                  <div class="card bg-warning text-dark p-3">
                    <h5>pending tasks</h5>
                    <h3 id="pending">0</h3>
                </div>
              </div>  
              <div class="col-md-4 mb-2">
                 <div class="card bg-success text-white p-3">
                    <h5>completed tasks</h5>
                    <h3 id="completed">0</h3>
                 </div>
              </div>               

           </div>
            <!-- Task status end -->
          <!-- search box start-->
           <div class="mt-4">
             <input type="text" id="search" 
             class="form-control"
             placeholder="Search tasks....">
           </div>
         <!-- search box end-->       
         <!-- Task list start -->
          <div class="card shadow mt-3 p-3">
            <h4>My Tasks</h4>
            <ul class="list-group" id="tasklist">
                
            </ul>
         </div>

         <!-- task list end -->


       </div>        



        <script>
            $(document).ready(()=>{
                let tasks=[];
                let addIndex=-1;
                //add task
                $("#addtask").click(()=>{
                let task=$("#task").val().trim()
                //if task is null
                if(task==""){
                    $("#message").html(
                    `<span class="text-danger">please enter task</span>`
                     );
                }
                //if task has data
                if(addIndex==-1){
                    tasks.push({
                        name:task,
                        status:false
                    })
                     $("#message").html(
                    `<span class="text-success">Task added successfully</span>`
                     );
                }
                $("#task").val("");


                

                })
            })

        </script>
    </body>
</html>
