<html>
    <head>

    </head>
    <body>
        <input type="text" id="num1" placeholder="Enter number1"><br/>
        <input type="text" id="num2" placeholder="Enter number1"><br/>
        <button id="add">Add</button>
        <p id="result"></p>
        <script>
            function addition(a,b){
                return a+b;
            }
            let arrowaddition=(a,b)=>{return a+b}

            document.getElementById("add").addEventListener("click",()=>{
                    let val1=parseInt(document.getElementById("num1").value);
                    let val2=parseInt(document.getElementById("num2").value);
                    let sum=arrowaddition(val1,val2);
                    document.getElementById("result").innerHTML=sum;
                    
            })

        </script>
    </body>
</html>
